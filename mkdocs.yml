site_name: (Matt)ers of Life and Tech
site_description: My blog, which is likely going to cover the gamut between tech, sports, a bit of politics, and who knows what else. This is just what the world needed, another tech nerd with a blog.
site_url: https://www.mattdies.com

theme:
  name: material
  logo: assets/logo/logo.png
  favicon: assets/favicon/favicon.ico
  features:
    - navigation.indexes
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - macros
  - search
  - blog:
      blog_toc: true
      archive_date_format: MMMM yyyy
      categories_allowed:
        - Tech
        - Personal Life
        - Docker
        - Python
        - Web
        - Politics
        - Sports
      pagination_per_page: 5
  - meta
  - tags

extra:
  social:
    - icon: fontawesome/brands/github
      name: matthewkdies on GitHub
      link: https://github.com/matthewkdies
    - icon: fontawesome/brands/linkedin
      name: Matthew Dies on LinkedIn
      link: https://www.linkedin.com/in/matthew-dies/

hooks:
  - hooks/socialmedia.py

markdown_extensions:
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - About Me: about_me.md
  - Blog:
     - blog/index.md
  - Tags: tags.md

extra_css:
  - stylesheets/extra.css
